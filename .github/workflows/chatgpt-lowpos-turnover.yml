name: chatgpt-lowpos-turnover-backtest

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/segment_structure_diagnostic.py'
      - 'research/miss_m123_diagnostic_v2.py'
      - '.github/workflows/chatgpt-lowpos-turnover.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Download full-market parquet data
        run: |
          mkdir -p bt_data
          for f in kline_000.parquet kline_002.parquet kline_300.parquet kline_600.parquet kline_688.parquet kline_other.parquet; do
            curl -L --fail --retry 3 -o "bt_data/$f" "https://raw.githubusercontent.com/newbiestring-lang/astock/main/$f"
          done
      - name: Rebuild structural target events
        run: python research/segment_structure_diagnostic.py
      - name: Run M1 M2 M3 V2
        run: python research/miss_m123_diagnostic_v2.py
      - name: Print M123 V2 summaries
        run: |
          cat bt_out/m123_v2_class_summary.csv
          echo '--- M2 BANDS ---'
          cat bt_out/m123_v2_m2_bands.csv
          echo '--- POSCAP ---'
          cat bt_out/m123_v2_poscap.csv
          echo '--- M1 OFFSETS ---'
          cat bt_out/m123_v2_m1_offsets.csv
          echo '--- M3 GRADUAL TOP ---'
          head -20 bt_out/m123_v2_m3_gradual.csv
      - uses: actions/upload-artifact@v4
        with:
          name: lowpos-turnover-m123-v2
          path: bt_out/
