name: chatgpt-lowpos-turnover-backtest

on:
  pull_request:
    branches:
      - chatgpt/mfe60-base
    paths:
      - 'research/lowpos_turnover_backtest.py'
      - 'research/recall_diagnostic.py'
      - '.github/workflows/chatgpt-lowpos-turnover.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Download full-market parquet data
        run: |
          mkdir -p bt_data
          for f in kline_000.parquet kline_002.parquet kline_300.parquet kline_600.parquet kline_688.parquet kline_other.parquet; do
            curl -L --fail --retry 3 -o "bt_data/$f" "https://raw.githubusercontent.com/newbiestring-lang/astock/main/$f"
          done
          ls -lh bt_data
      - name: Run backtest
        run: python research/lowpos_turnover_backtest.py
      - name: Run recall diagnostic
        run: python research/recall_diagnostic.py
      - name: Print summaries
        run: |
          cat bt_out/meta.json
          echo '--- recall mfe60 ---'
          cat bt_out/recall_mfe60.csv
      - uses: actions/upload-artifact@v4
        with:
          name: lowpos-turnover-backtest-results
          path: bt_out/
