name: chatgpt-lowpos-turnover-backtest

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/segment_structure_diagnostic.py'
      - 'research/miss_m123_diagnostic.py'
      - '.github/workflows/chatgpt-lowpos-turnover.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Download full-market parquet data
        run: |
          mkdir -p bt_data
          for f in kline_000.parquet kline_002.parquet kline_300.parquet kline_600.parquet kline_688.parquet kline_other.parquet; do
            curl -L --fail --retry 3 -o "bt_data/$f" "https://raw.githubusercontent.com/newbiestring-lang/astock/main/$f"
          done
      - name: Rebuild structural target events
        run: python research/segment_structure_diagnostic.py
      - name: Run M1 M2 M3 miss decomposition
        run: python research/miss_m123_diagnostic.py
      - name: Print M123 summaries
        run: |
          echo '--- CLASS SUMMARY ---'
          cat bt_out/m123_class_summary.csv
          echo '--- M2 POSITION BANDS ---'
          cat bt_out/m2_position_bands.csv
          echo '--- POSITION CAP SENSITIVITY ---'
          cat bt_out/m2_poscap_sensitivity.csv
          echo '--- M1 TIMING ---'
          cat bt_out/m1_timing_offsets.csv
          echo '--- M3 TOP POS20 ---'
          head -20 bt_out/m3_gradual_rank_poscap_20.csv
      - uses: actions/upload-artifact@v4
        with:
          name: lowpos-turnover-m123-diagnostic
          path: bt_out/
