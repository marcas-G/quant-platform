name: chatgpt-lowpos-turnover-backtest

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/inventory_rotation_precision.py'
      - '.github/workflows/chatgpt-lowpos-turnover.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Download full-market parquet data
        run: |
          mkdir -p bt_data
          for f in kline_000.parquet kline_002.parquet kline_300.parquet kline_600.parquet kline_688.parquet kline_other.parquet; do
            curl -L --fail --retry 3 -o "bt_data/$f" "https://raw.githubusercontent.com/newbiestring-lang/astock/main/$f"
          done
      - name: Run cumulative-turnover price-displacement experiment
        run: python research/inventory_rotation_precision.py
      - name: Print summaries
        run: |
          echo '--- BASELINES ---'
          cat bt_out_inventory_rotation/inventory_rotation_baselines.csv
          echo '--- TOP UNIVARIATE ---'
          head -31 bt_out_inventory_rotation/inventory_rotation_univariate.csv
          echo '--- CORE SUMMARY ---'
          cat bt_out_inventory_rotation/inventory_rotation_core_summary.csv
          echo '--- YEAR STABILITY ---'
          cat bt_out_inventory_rotation/inventory_rotation_year_stability.csv
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-rotation-precision
          path: bt_out_inventory_rotation/
