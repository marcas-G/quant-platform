name: chatgpt-lowpos-turnover-backtest

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/lowpos_turnover_backtest.py'
      - 'research/recall_diagnostic.py'
      - 'research/segment_structure_diagnostic.py'
      - 'research/segment_precision_diagnostic.py'
      - '.github/workflows/chatgpt-lowpos-turnover.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Download full-market parquet data
        run: |
          mkdir -p bt_data
          for f in kline_000.parquet kline_002.parquet kline_300.parquet kline_600.parquet kline_688.parquet kline_other.parquet; do
            curl -L --fail --retry 3 -o "bt_data/$f" "https://raw.githubusercontent.com/newbiestring-lang/astock/main/$f"
          done
      - name: Run deep-bottom precision diagnostic
        run: python research/segment_precision_diagnostic.py
      - name: Print precision summary
        run: cat bt_out/deep_bottom_precision_recall_15pct.csv
      - uses: actions/upload-artifact@v4
        with:
          name: lowpos-turnover-deep-bottom-precision
          path: bt_out/
